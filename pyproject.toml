[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-env-crypt"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["azure-cli>=2.91.0", "pyAesCrypt>=6.1.1"]

[tool.setuptools]
packages = ["azure_env_crypt"]
package-dir = { azure_env_crypt = "." }
